<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4f6ef7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="单词书" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>英语单词书</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
      // Configure Tesseract to use Chinese-friendly CDN
      if (typeof Tesseract !== 'undefined') {
        Tesseract.setLogging(true);
      }
    </script>
    <style>
      :root {
        --primary: #4f6ef7;
        --primary-light: #eef1ff;
        --success: #10b981;
        --success-light: #d1fae5;
        --error: #ef4444;
        --error-light: #fee2e2;
        --warning: #f59e0b;
        --warning-light: #fef3c7;
        --bg: #f6f8fc;
        --card: #ffffff;
        --text: #1a1f36;
        --text-secondary: #6b7280;
        --border: #e5e7eb;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.04);
        --radius: 12px;
        --radius-sm: 8px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }


      /* Unit Phrase section */
      .unit-phrase-section {
        margin-top: 16px;
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .unit-phrase-section-header {
        padding: 12px 16px;
        background: var(--success-light);
        font-size: 14px;
        font-weight: 600;
        color: var(--success);
        border-bottom: 1px solid var(--border);
      }

      .unit-phrase-list {
        padding: 8px 0;
      }

      .unit-phrase-item {
        display: flex;
        align-items: center;
        padding: 10px 16px;
        gap: 12px;
        border-bottom: 1px solid var(--border);
      }

      .phrase-item:last-child {
        border-bottom: none;
      }

      .unit-phrase-text {
        font-weight: 600;
        font-size: 15px;
        color: var(--text);
        min-width: 140px;
      }

      .unit-phrase-meaning {
        font-size: 14px;
        color: var(--text-secondary);
        flex: 1;
      }

      .unit-phrase-speak-btn {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        border: none;
        background: var(--success-light);
        color: var(--success);
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .unit-phrase-speak-btn:hover {
        background: var(--success);
        color: white;
      }

      .unit-phrase-speak-btn svg {
        width: 16px;
        height: 16px;
      }

      /* Unit Sentence section */
      .unit-sentence-section {
        margin-top: 16px;
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .unit-sentence-section-header {
        padding: 12px 16px;
        background: var(--warning-light);
        font-size: 14px;
        font-weight: 600;
        color: var(--warning);
        border-bottom: 1px solid var(--border);
      }

      .unit-sentence-list {
        padding: 8px 0;
      }

      .unit-sentence-item {
        display: flex;
        align-items: flex-start;
        padding: 12px 16px;
        gap: 12px;
        border-bottom: 1px solid var(--border);
      }

      .sentence-item:last-child {
        border-bottom: none;
      }

      .unit-sentence-cn {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 4px;
      }

      .unit-sentence-en {
        font-size: 15px;
        font-weight: 500;
        color: var(--text);
        flex: 1;
      }

      .unit-sentence-speak-btn {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        border: none;
        background: var(--warning-light);
        color: var(--warning);
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        margin-top: 4px;
      }

      .unit-sentence-speak-btn:hover {
        background: var(--warning);
        color: white;
      }

      .unit-sentence-speak-btn svg {
        width: 16px;
        height: 16px;
      }

      /* Header */
      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 12px 20px;
      }

      .header-inner {
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .logo {
        font-size: 20px;
        font-weight: 700;
        color: var(--primary);
        white-space: nowrap;
      }

      .mode-switch {
        display: flex;
        gap: 4px;
        background: var(--bg);
        padding: 4px;
        border-radius: 20px;
      }

      .mode-btn {
        padding: 6px 14px;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 14px;
        font-weight: 500;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .mode-btn.active {
        background: var(--primary);
        color: #fff;
      }

      .search-box {
        flex: 1;
        position: relative;
        min-width: 200px;
      }

      .search-box input {
        width: 100%;
        padding: 10px 16px 10px 40px;
        border: 1px solid var(--border);
        border-radius: 24px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        background: var(--bg);
      }

      .search-box input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-light);
        background: #fff;
      }

      .search-box svg {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary);
        width: 18px;
        height: 18px;
      }

      .word-count {
        font-size: 13px;
        color: var(--text-secondary);
        white-space: nowrap;
      }

      /* PDF Upload */
      .upload-btn {
        padding: 8px 16px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 13px;
        font-weight: 500;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .upload-btn:hover {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .upload-btn svg {
        width: 16px;
        height: 16px;
      }

      #pdfFileInput {
        display: none;
      }

      /* Unit Navigation */
      .unit-nav {
        position: sticky;
        top: 61px;
        z-index: 90;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        padding: 10px 12px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        display: flex;
        align-items: center;
        gap: 0;
      }

      .unit-nav::-webkit-scrollbar {
        display: none;
      }

      .unit-nav-arrow {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 50%;
        background: var(--primary);
        color: white;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.8;
        transition: opacity 0.2s;
        z-index: 2;
        line-height: 1;
        padding: 0;
      }

      .unit-nav-arrow:hover {
        opacity: 1;
      }

      .unit-nav-arrow.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .unit-nav-inner {
        display: flex;
        gap: 8px;
        flex-wrap: nowrap;
        flex: 1;
        overflow-x: auto;
        scrollbar-width: none;
        scroll-behavior: smooth;
      }

      .unit-nav-inner::-webkit-scrollbar {
        display: none;
      }

      .unit-btn {
        padding: 6px 14px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
      }

      .unit-btn:hover {
        background: var(--primary-light);
        color: var(--primary);
        border-color: var(--primary);
      }

      .unit-btn.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .unit-section {
        margin-bottom: 32px;
      }

      .unit-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 2px solid var(--success);
      }

      .unit-icon {
        width: 40px;
        height: 40px;
        background: var(--success);
        color: #fff;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
      }

      .unit-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--text);
      }

      .unit-count {
        font-size: 13px;
        color: var(--text-secondary);
        margin-left: auto;
      }

      /* Phrase and Sentence Sections */
      .phrase-section {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px dashed var(--border);
      }

      .phrase-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .phrase-item {
        background: #fef3c7;
        color: #92400e;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 16px;
        border: 1px solid #fde68a;
      }

      .sentence-section {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px dashed var(--border);
      }

      .sentence-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 8px;
      }

      .sentence-item {
        background: var(--bg);
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        border-left: 3px solid var(--success);
      }

      .sentence-en {
        font-size: 14px;
        color: var(--text);
        line-height: 1.6;
        margin-bottom: 4px;
      }

      .sentence-en em {
        color: var(--success);
        font-style: normal;
        font-weight: 600;
      }

      .sentence-cn {
        font-size: 13px;
        color: var(--text-secondary);
      }

      /* PDF Parse Modal */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 20px;
      }

      .modal {
        background: var(--card);
        border-radius: var(--radius);
        padding: 24px;
        max-width: 500px;
        width: 100%;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: var(--shadow-md);
      }

      .modal-title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 16px;
        color: var(--text);
      }

      .modal-content {
        font-size: 14px;
        color: var(--text);
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .modal-actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }

      .modal-btn {
        padding: 10px 20px;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .modal-btn.primary {
        background: var(--primary);
        color: #fff;
      }

      .modal-btn.primary:hover {
        background: #3b5de7;
      }

      .modal-btn.secondary {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .modal-btn.secondary:hover {
        background: var(--border);
      }

      .parse-progress {
        margin: 16px 0;
      }

      .parse-progress-bar {
        height: 8px;
        background: var(--bg);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 8px;
      }

      .parse-progress-fill {
        height: 100%;
        background: var(--primary);
        border-radius: 4px;
        transition: width 0.3s;
      }

      .parse-progress-text {
        font-size: 13px;
        color: var(--text-secondary);
        text-align: center;
      }

      .parse-result {
        background: var(--bg);
        padding: 12px;
        border-radius: var(--radius-sm);
        margin-top: 12px;
        font-size: 13px;
      }

      .parse-result-item {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
      }

      .parse-result-item:last-child {
        border-bottom: none;
      }

      /* OCR Styles */
      .ocr-options {
        margin: 16px 0;
        padding: 12px;
        background: var(--bg);
        border-radius: var(--radius-sm);
      }

      .ocr-option-group {
        margin-bottom: 12px;
      }

      .ocr-option-group:last-child {
        margin-bottom: 0;
      }

      .ocr-option-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 6px;
        display: block;
      }

      .ocr-option-input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 13px;
        outline: none;
      }

      .ocr-option-input:focus {
        border-color: var(--primary);
      }

      .ocr-page-range {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .ocr-page-input {
        width: 80px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 13px;
        outline: none;
      }

      .ocr-page-input:focus {
        border-color: var(--primary);
      }

      .ocr-progress-detail {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 8px;
        text-align: center;
      }

      .ocr-preview {
        margin-top: 12px;
        padding: 12px;
        background: var(--bg);
        border-radius: var(--radius-sm);
        max-height: 200px;
        overflow-y: auto;
        font-size: 12px;
        font-family: monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .ocr-lang-select {
        display: flex;
        gap: 8px;
      }

      .ocr-lang-btn {
        flex: 1;
        padding: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 13px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .ocr-lang-btn.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .ocr-lang-btn:hover:not(.active) {
        background: var(--primary-light);
        color: var(--primary);
      }

      /* History Manager */
      .history-manager {
        padding: 8px 0;
      }

      .history-section {
        background: var(--bg);
        border-radius: var(--radius-sm);
        padding: 16px;
        margin-bottom: 12px;
      }

      .history-section-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .history-section-desc {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 12px;
        line-height: 1.5;
      }

      .history-section-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .history-btn {
        padding: 8px 16px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 13px;
        font-weight: 500;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .history-btn:hover {
        background: var(--primary-light);
        color: var(--primary);
        border-color: var(--primary);
      }

      .history-btn.danger {
        color: var(--error);
        border-color: var(--error-light);
      }

      .history-btn.danger:hover {
        background: var(--error);
        color: #fff;
        border-color: var(--error);
      }

      .history-stats {
        display: flex;
        gap: 16px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .history-stat {
        font-size: 13px;
        color: var(--text-secondary);
      }

      .history-stat strong {
        color: var(--primary);
        font-weight: 600;
      }

      .confirm-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1100;
        padding: 20px;
      }

      .confirm-dialog {
        background: var(--card);
        border-radius: var(--radius);
        padding: 24px;
        max-width: 400px;
        width: 100%;
        box-shadow: var(--shadow-md);
      }

      .confirm-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 12px;
      }

      .confirm-message {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 20px;
        line-height: 1.6;
      }

      .confirm-actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }

      /* Unit Navigation */
      .unit-nav {
        position: sticky;
        top: 61px;
        z-index: 90;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        padding: 10px 12px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        display: flex;
        align-items: center;
        gap: 0;
      }

      .unit-nav::-webkit-scrollbar {
        display: none;
      }

      .unit-nav-arrow {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 50%;
        background: var(--primary);
        color: white;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.8;
        transition: opacity 0.2s;
        z-index: 2;
        line-height: 1;
        padding: 0;
      }

      .unit-nav-arrow:hover {
        opacity: 1;
      }

      .unit-nav-arrow.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .unit-nav-inner {
        display: flex;
        gap: 8px;
        flex-wrap: nowrap;
        flex: 1;
        overflow-x: auto;
        scrollbar-width: none;
        scroll-behavior: smooth;
      }

      .unit-nav-inner::-webkit-scrollbar {
        display: none;
      }

      .unit-btn {
        padding: 6px 14px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
      }

      .unit-btn:hover {
        background: var(--primary-light);
        color: var(--primary);
        border-color: var(--primary);
      }

      .unit-btn.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      /* Word Card */
      .word-card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 12px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        transition: box-shadow 0.2s, transform 0.2s;
        cursor: pointer;
      }

      .word-card:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }

      .word-card.expanded {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary-light), var(--shadow-md);
      }

      .word-top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .word-main {
        flex: 1;
      }

      .word-text {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .speak-btn {
        width: 28px;
        height: 28px;
        border: none;
        background: var(--primary-light);
        color: var(--primary);
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        flex-shrink: 0;
      }

      .speak-btn:hover {
        background: var(--primary);
        color: #fff;

      // Sentence/Phrase lookup arrays for speak buttons
      var __allPhrases = PHRASES;

      let voicesLoaded = false;
      let selectedVoice = null;
      let audioUnlocked = false;
      let ttsAudio = null;

      function loadVoices() {
        const voices = speechSynthesis.getVoices();
        if (voices.length > 0) {
          voicesLoaded = true;
          selectedVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google'))
            || voices.find(v => v.lang === 'en-US')
            || voices.find(v => v.lang.startsWith('en'))
            || voices[0];
        }
      }

      if ('speechSynthesis' in window) {
        loadVoices();
        speechSynthesis.onvoiceschanged = loadVoices;

        function unlockAudio() {
          if (audioUnlocked) return;
          audioUnlocked = true;
          const u = new SpeechSynthesisUtterance('');
          u.volume = 0;
          speechSynthesis.speak(u);
        }
        document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
        document.addEventListener('click', unlockAudio, { once: true });

        setInterval(() => {
          if (speechSynthesis.speaking && !speechSynthesis.paused) {
            speechSynthesis.pause();
            speechSynthesis.resume();
          }
        }, 10000);
      }

      function speak(word) {
        if ('speechSynthesis' in window) {
          const synth = window.speechSynthesis;
          synth.cancel();
          const utterance = new SpeechSynthesisUtterance(word);
          utterance.lang = "en-US";
          utterance.rate = 0.75;
          utterance.pitch = 1;
          utterance.volume = 1;
          if (selectedVoice) {
            utterance.voice = selectedVoice;
          }
          utterance.onend = () => {};
          utterance.onerror = () => {};
          synth.speak(utterance);
          setTimeout(() => {
            if (!synth.speaking) {
              synth.speak(utterance);
            }
          }, 100);
        } else {
          // Fallback: Youdao TTS for browsers without speechSynthesis
          if (ttsAudio) {
            ttsAudio.pause();
            ttsAudio = null;
          }
          ttsAudio = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=1');
          ttsAudio.volume = 1;
          ttsAudio.play().catch(() => {});
        }
      }

      function shuffleArray(arr) {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      }

      function createWordCard(item) {
        const card = document.createElement("div");
        card.className = "word-card";
        card.setAttribute("data-word", item.word.toLowerCase());
        card.setAttribute("data-def", item.meanings.map((m) => m.def).join(" "));

        const meaningsHtml = item.meanings
          .map((m) => `<span class="pos-tag">${m.pos}</span> ${m.def}`)
          .join("&nbsp;&nbsp;");

        const extendHtml =
          item.extend.length > 0
            ? `<div class="detail-section">
                <div class="detail-label">拓展词汇</div>
                <div class="extend-words">
                  ${item.extend.map((e) => `<span class="extend-tag">${e}</span>`).join("")}
                </div>
              </div>`
            : "";

        const phrasesHtml =
          item.phrases.length > 0
            ? `<div class="detail-section">
                <div class="detail-label">常用短语</div>
                <div class="extend-words">
                  ${item.phrases.map((p) => `<span class="phrase-tag">${p}</span>`).join("")}
                </div>
              </div>`
            : "";

        card.innerHTML = `
          <div class="word-top">
            <div class="word-main">
              <div class="word-text">
                ${item.word}
                <button class="speak-btn" onclick="event.stopPropagation(); speak('${item.word}')" title="朗读">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                  </svg>
                </button>
              </div>
              <div class="word-phonetic">${item.phonetic ? '/' + item.phonetic + '/' : ''}</div>
              <div class="word-syllable">${item.syllables && item.syllables !== item.word ? item.syllables : ''}</div>
              <div class="word-brief">${meaningsHtml}</div>
            </div>
          </div>
          <div class="word-detail">
            ${item.examples && item.examples.length > 0 ? `
            <div class="detail-section">
              <div class="detail-label">例句</div>
              <div class="detail-content">
                ${item.examples.map((ex, i) => `<div class="example-sentence">${ex}</div>`).join("")}
              </div>
            </div>` : ''}
            ${extendHtml}
            ${phrasesHtml}
          </div>
          <div class="expand-hint">点击展开详情 ↓</div>
        `;

        card.addEventListener("click", (e) => {
          if (e.target.closest(".speak-btn")) return;
          card.classList.toggle("expanded");
        });

        return card;
      }

      function renderWords(filterText = "") {
        const content = document.getElementById("content");
        content.innerHTML = "";

        let filtered = WORDS;
        if (filterText) {
          const q = filterText.toLowerCase();
          filtered = WORDS.filter(
            (w) =>
              w.word.toLowerCase().includes(q) ||
              w.meanings.some((m) => m.def.includes(q))
          );
        }

        if (filtered.length === 0) {
          content.innerHTML = `
            <div class="no-results">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
              </svg>
              <p>没有找到匹配的单词</p>
            </div>
          `;
          return;
        }

        const units = groupByUnit(filtered);
        const sortedUnits = Object.keys(units).sort((a, b) => {
          const numA = parseInt(a.replace(/\D/g, '')) || 0;
          const numB = parseInt(b.replace(/\D/g, '')) || 0;
          return numA - numB;
        });

        sortedUnits.forEach((unit) => {
          const section = document.createElement("div");
          section.className = "unit-section";
          section.id = `unit-${unit.replace(/\s+/g, '-')}`;

          section.innerHTML = `
            <div class="unit-header">
              <div class="unit-icon">${unit.replace('List ', '').replace('Unit ', '')}</div>
              <div class="unit-title">${unit}</div>
              <div class="unit-count">${units[unit].length} 个</div>
            </div>
          `;

          units[unit].forEach((item) => {
            section.appendChild(createWordCard(item));
          });

          // Add phrase section
          const unitPhrases = PHRASES.filter(p => p.unit === unit);
          if (unitPhrases.length > 0) {
            const phraseSection = document.createElement("div");
            phraseSection.className = "unit-phrase-section";
            let phraseHtml = '<div class="unit-phrase-section-header"><span>📝 词组 (' + unitPhrases.length + ')</span></div>';
            phraseHtml += '<div class="unit-phrase-list">';
            unitPhrases.forEach(p => {
              phraseHtml += '<div class="unit-phrase-item">';
              phraseHtml += '<div class="unit-phrase-text">' + p.phrase + '</div>';
              phraseHtml += '<div class="unit-phrase-meaning">' + p.meaning + '</div>';
              phraseHtml += '<button class="unit-phrase-speak-btn" onclick="speak(__allPhrases[' + unitPhrases.indexOf(p) + '].phrase)" title="朗读">';
              phraseHtml += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></svg>';
              phraseHtml += '</button></div>';
            });
            phraseHtml += '</div>';
            phraseSection.innerHTML = phraseHtml;
            section.appendChild(phraseSection);
          }

          // Add sentence section
          const unitSentences = SENTENCES.filter(s => s.unit === unit);
          if (unitSentences.length > 0) {
            const sentenceSection = document.createElement("div");
            sentenceSection.className = "unit-sentence-section";
            let sentenceHtml = '<div class="unit-sentence-section-header"><span>📖 句子 (' + unitSentences.length + ')</span></div>';
            sentenceHtml += '<div class="unit-sentence-list">';
            unitSentences.forEach(s => {
              sentenceHtml += '<div class="unit-sentence-item">';
              sentenceHtml += '<div class="unit-sentence-cn">' + s.cn + '</div>';
              sentenceHtml += '<div class="unit-sentence-en">' + s.en + '</div>';
              sentenceHtml += '<button class="unit-sentence-speak-btn" onclick="speak(__allSentences[' + unitSentences.indexOf(s) + '].en)" title="朗读">';
              sentenceHtml += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></svg>';
              sentenceHtml += '</button></div>';
            });
            sentenceHtml += '</div>';
            sentenceSection.innerHTML = sentenceHtml;
            section.appendChild(sentenceSection);
          }

          content.appendChild(section);
        });

        document.getElementById("wordCount").textContent = `共 ${filtered.length} 个单词`;
      }

      function groupByUnit(words) {
        const groups = {};
        words.forEach((w) => {
          const unit = w.unit || '默认单元';
          if (!groups[unit]) groups[unit] = [];
          groups[unit].push(w);
        });
        return groups;
      }
