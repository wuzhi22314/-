        const searchBox = document.getElementById("searchBox");
        const wordCount = document.getElementById("wordCount");
        if (alphaNav) alphaNav.style.display = "none";
        if (searchBox) searchBox.style.display = "none";
        if (wordCount) wordCount.style.display = "none";

        content.innerHTML = `
          <div class="quiz-unit-select">
            <div class="quiz-select-header">
              <h2>选择默写类型</h2>
              <p>选择要默写的内容类型</p>
            </div>
            <div class="quiz-unit-grid">
              <div class="quiz-unit-card" data-type="word" style="border-left: 4px solid var(--primary);">
                <div class="quiz-unit-icon">🔤</div>
                <div class="quiz-unit-name">单词默写</div>
                <div class="quiz-unit-count">${WORDS.length} 个</div>
              </div>
              <div class="quiz-unit-card" data-type="phrase" style="border-left: 4px solid var(--success);">
                <div class="quiz-unit-icon">📝</div>
                <div class="quiz-unit-name">词组默写</div>
                <div class="quiz-unit-count">${PHRASES.length} 个</div>
              </div>
              <div class="quiz-unit-card" data-type="sentence" style="border-left: 4px solid var(--warning);">
                <div class="quiz-unit-icon">📖</div>
                <div class="quiz-unit-name">句子默写</div>
                <div class="quiz-unit-count">${SENTENCES.length} 个</div>
              </div>
            </div>
          </div>
        `;

        content.querySelectorAll('.quiz-unit-card').forEach(card => {
          card.addEventListener('click', () => {
            renderQuizUnitSelect(card.dataset.type);
          });
        });
      }

      function renderQuizUnitSelect(quizType) {
        quizType = quizType || 'word';
        const content = document.getElementById("content");
        let dataSource, typeLabel, typeIcon;
        if (quizType === 'phrase') {
          dataSource = PHRASES;
          typeLabel = '词组';
          typeIcon = '📝';
        } else if (quizType === 'sentence') {
          dataSource = SENTENCES;
          typeLabel = '句子';
          typeIcon = '📖';
        } else {
          dataSource = WORDS;
          typeLabel = '单词';
          typeIcon = '🔤';
        }

        const units = [...new Set(dataSource.map(w => w.unit || '默认单元'))];
        units.sort((a, b) => {
          const numA = parseInt(a.replace(/\D/g, '')) || 0;
          const numB = parseInt(b.replace(/\D/g, '')) || 0;
          return numA - numB;
        });

        const unitCounts = {};
        dataSource.forEach(w => {
          const u = w.unit || '默认单元';
          unitCounts[u] = (unitCounts[u] || 0) + 1;
        });

        content.innerHTML = `
          <div class="quiz-unit-select">
            <div class="quiz-select-header">
              <h2>${typeIcon} 选择默写单元</h2>
              <p>选择一个单元开始${typeLabel}默写，或选择全部${typeLabel}</p>
              <button class="quiz-back-btn" onclick="renderQuizTypeSelect()">← 返回类型选择</button>
            </div>
            <div class="quiz-unit-grid">
              <div class="quiz-unit-card all-words" data-unit="all">
                <div class="quiz-unit-icon">📚</div>
                <div class="quiz-unit-name">全部${typeLabel}</div>
                <div class="quiz-unit-count">${dataSource.length} 个</div>
              </div>
              ${units.map(unit => `
                <div class="quiz-unit-card" data-unit="${unit}">
                  <div class="quiz-unit-icon">${unit.replace('List ', '').replace('Unit ', '')}</div>
                  <div class="quiz-unit-name">${unit}</div>
                  <div class="quiz-unit-count">${unitCounts[unit]} 个</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;

        content.querySelectorAll('.quiz-unit-card').forEach(card => {
          card.addEventListener('click', () => {
            const unit = card.dataset.unit;
            const items = unit === 'all' ? dataSource : dataSource.filter(w => (w.unit || '默认单元') === unit);
            startQuiz(items, unit === 'all' ? '全部' + typeLabel : unit, quizType);
          });
        });
      }

      function startQuiz(items, unitName, quizType) {
        quizState = {
          words: shuffleArray(items),
          currentIndex: 0,
          correct: 0,
          wrong: 0,
          wrongWords: [],
          answered: false,
          unitName: unitName || '全部单词',
          quizType: quizType || 'word',
        };
        renderQuiz();
      }

      function renderQuiz() {
        const content = document.getElementById("content");
        const alphaNav = document.getElementById("alphaNav");
        const searchBox = document.getElementById("searchBox");
        const wordCount = document.getElementById("wordCount");

        if (alphaNav) alphaNav.style.display = "none";
        if (searchBox) searchBox.style.display = "none";
        if (wordCount) wordCount.style.display = "none";

        if (quizState.currentIndex >= quizState.words.length) {
          renderQuizResult();
          return;
        }

        const current = quizState.words[quizState.currentIndex];
        const progress = ((quizState.currentIndex + 1) / quizState.words.length) * 100;
        const qt = quizState.quizType || 'word';

        let titleText, subtitleText, questionHtml, inputPlaceholder, speakText;
        if (qt === 'phrase') {
          titleText = '看中文写词组';
          subtitleText = quizState.unitName + ' · 根据释义写出对应的英文词组';
          questionHtml = '<div class="quiz-meaning">' + current.meaning + '</div>';
          inputPlaceholder = '输入英文词组...';
          speakText = current.phrase;
        } else if (qt === 'sentence') {
          titleText = '看中文写句子';
          subtitleText = quizState.unitName + ' · 根据中文写出对应的英文句子';
          questionHtml = '<div class="quiz-meaning" style="font-size:16px;line-height:1.8;">' + current.cn + '</div>';
          inputPlaceholder = '输入英文句子...';
          speakText = current.en;
        } else {
          titleText = '看中文写英文';
          subtitleText = quizState.unitName + ' · 根据释义写出对应的英文单词';
          questionHtml = '<div class="quiz-pos">' + current.meanings[0].pos + '</div>'
            + '<div class="quiz-meaning">' + current.meanings[0].def + '</div>'
            + '<button class="quiz-speak-btn" onclick="speak(\'' + current.word.replace(/'/g, "\\'") + '\')" title="朗读单词">'
            + '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">'
            + '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />'
            + '<path d="M15.54 8.46a5 5 0 0 1 0 7.07" />'
            + '<path d="M19.07 4.93a10 10 0 0 1 0 14.14" />'
            + '</svg> 听读音</button>';
          inputPlaceholder = '输入英文单词...';
          speakText = current.word;
        }

        const isSentence = qt === 'sentence';

        content.innerHTML = `
          <div class="quiz-container">
            <div class="quiz-header">
              <div class="quiz-title">${titleText}</div>
              <div class="quiz-subtitle">${subtitleText}</div>
              <button class="quiz-back-btn" onclick="renderQuizUnitSelect('${qt}')">← 返回选择</button>
            </div>

            <div class="quiz-stats">
              <div class="stat-item">
                <div class="stat-value">${quizState.currentIndex + 1}/${quizState.words.length}</div>
                <div class="stat-label">进度</div>
              </div>
              <div class="stat-item">
                <div class="stat-value correct">${quizState.correct}</div>
                <div class="stat-label">正确</div>
              </div>
              <div class="stat-item">
                <div class="stat-value wrong">${quizState.wrong}</div>
                <div class="stat-label">错误</div>
              </div>
            </div>

            <div class="quiz-card">
              <div class="quiz-progress">
                <span class="progress-text">${quizState.currentIndex + 1} / ${quizState.words.length}</span>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${progress}%"></div>
                </div>
                <span class="progress-text">${Math.round(progress)}%</span>
              </div>

              <div class="quiz-question">
                ${questionHtml}
                <div class="quiz-hint" id="quizHint" style="display: none;"></div>
              </div>

              <div class="quiz-input-area">
                ${isSentence
                  ? '<textarea class="quiz-input" id="quizInput" placeholder="' + inputPlaceholder + '" rows="3" autocomplete="off" spellcheck="false"></textarea>'
                  : '<input type="text" class="quiz-input" id="quizInput" placeholder="' + inputPlaceholder + '" autocomplete="off" spellcheck="false" />'
                }
              </div>

              <div class="quiz-actions">
                <button class="quiz-btn secondary" id="hintBtn" onclick="showHint()">提示</button>
                <button class="quiz-btn primary" id="submitBtn" onclick="checkAnswer()">提交</button>
                <button class="quiz-btn secondary" id="nextBtn" onclick="nextWord()" style="display: none;">下一个</button>
              </div>

              <div class="quiz-feedback" id="quizFeedback"></div>
            </div>
          </div>
        `;

        const input = document.getElementById("quizInput");
        input.focus();
        input.addEventListener("keypress", (e) => {
          if (e.key === "Enter" && !isSentence) {
            if (!quizState.answered) {
              checkAnswer();
            } else {
              nextWord();
            }
          }
        });
        if (isSentence) {
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
              e.preventDefault();
              if (!quizState.answered) {
                checkAnswer();
              } else {
                nextWord();
              }
            }
          });
        }
      }

      function showHint() {
        const current = quizState.words[quizState.currentIndex];
        const hint = document.getElementById("quizHint");
        const qt = quizState.quizType || 'word';
        hint.style.display = "block";
        if (qt === 'phrase') {
          hint.textContent = '首字母：' + current.phrase[0].toUpperCase() + ' | 长度：' + current.phrase.length + ' 个字符';
        } else if (qt === 'sentence') {
          hint.textContent = '首字母：' + current.en[0].toUpperCase() + ' | 长度：' + current.en.length + ' 个字符';
        } else {
          hint.textContent = '音节：' + (current.syllables || current.syllable || '') + ' | 首字母：' + current.word[0].toUpperCase();
        }
      }

      function normalizeStr(s) {
        return s.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,!?;:'"()]/g, '').replace(/\.$/, '');
      }

      function checkAnswer() {
        if (quizState.answered) return;

        const input = document.getElementById("quizInput");
        const feedback = document.getElementById("quizFeedback");
        const current = quizState.words[quizState.currentIndex];
        const qt = quizState.quizType || 'word';
        const userAnswer = input.value.trim();

        if (!userAnswer) {
          input.style.borderColor = "var(--error)";
          setTimeout(() => { input.style.borderColor = ""; }, 500);
          return;
        }

        quizState.answered = true;
        let correctAnswer, isCorrect;
        if (qt === 'phrase') {
          correctAnswer = current.phrase;
          isCorrect = normalizeStr(userAnswer) === normalizeStr(correctAnswer);
        } else if (qt === 'sentence') {
          correctAnswer = current.en;
          isCorrect = normalizeStr(userAnswer) === normalizeStr(correctAnswer);
        } else {
          correctAnswer = current.word;
          isCorrect = userAnswer.toLowerCase() === correctAnswer.toLowerCase();
        }

        if (isCorrect) {
          quizState.correct++;
          if (qt === 'word') markWordLearned(current.word);
          input.classList.add("correct");
          feedback.className = "quiz-feedback show correct";
          feedback.innerHTML = '<div>✓ 正确！</div><div class="answer">' + correctAnswer + '</div>';
          speak(correctAnswer);
        } else {
          quizState.wrong++;
          quizState.wrongWords.push(current);
          input.classList.add("wrong");
          feedback.className = "quiz-feedback show wrong";
          feedback.innerHTML = '<div>✗ 错误</div><div class="answer">正确答案：' + correctAnswer + '</div>';
        }

        document.getElementById("submitBtn").style.display = "none";
        document.getElementById("hintBtn").style.display = "none";
        document.getElementById("nextBtn").style.display = "inline-block";
        document.getElementById("nextBtn").focus();

        document.querySelectorAll(".stat-value.correct")[0].textContent = quizState.correct;
        document.querySelectorAll(".stat-value.wrong")[0].textContent = quizState.wrong;
      }

      function nextWord() {
        quizState.currentIndex++;
        quizState.answered = false;
        renderQuiz();
      }

      function renderQuizResult() {
        const content = document.getElementById("content");
        const total = quizState.words.length;
        const accuracy = Math.round((quizState.correct / total) * 100);
        const qt = quizState.quizType || 'word';
        const typeLabel = qt === 'phrase' ? '词组' : qt === 'sentence' ? '句子' : '单词';

        let wrongHtml = "";
        if (quizState.wrongWords.length > 0) {
          wrongHtml = `
            <div class="wrong-words-list">
              <h3 style="margin-bottom: 12px; font-size: 16px;">需要巩固的${typeLabel}</h3>
              ${quizState.wrongWords.map((w) => {
                let text, meaning;
                if (qt === 'phrase') {
                  text = w.phrase;
                  meaning = w.meaning;
                } else if (qt === 'sentence') {
                  text = w.en;
                  meaning = w.cn;
                } else {
                  text = w.word;
                  meaning = w.meanings[0].def;
                }
                return `<div class="wrong-word-item">
                  <div>
                    <div class="wrong-word-text">${text}</div>
                    <div class="wrong-word-meaning">${meaning}</div>
                  </div>
                  <button class="speak-btn" onclick="speak('${text.replace(/'/g, "\\'")}')" title="朗读">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                      <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                      <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                    </svg>
                  </button>
                </div>`;
              }).join("")}
            </div>
          `;
        }

        let redoAllFn;
        if (qt === 'phrase') {
          redoAllFn = "startQuiz(PHRASES, '全部词组', 'phrase')";
        } else if (qt === 'sentence') {
          redoAllFn = "startQuiz(SENTENCES, '全部句子', 'sentence')";
        } else {
          redoAllFn = "startQuiz(WORDS, '全部单词', 'word')";
        }

        content.innerHTML = `
          <div class="quiz-container">
            <div class="quiz-result">
              <div class="result-icon">${accuracy >= 80 ? "🎉" : accuracy >= 60 ? "👍" : "💪"}</div>
              <div class="result-title">${typeLabel}默写完成！</div>
              <div style="color: var(--text-secondary); margin-bottom: 24px;">
                ${accuracy >= 80 ? "太棒了！继续保持！" : accuracy >= 60 ? "不错，继续加油！" : "多多练习，你会更好的！"}
              </div>

              <div class="result-stats">
                <div class="result-stat">
                  <div class="result-stat-value" style="color: var(--primary);">${total}</div>
                  <div class="result-stat-label">总${typeLabel}数</div>
                </div>
                <div class="result-stat">
                  <div class="result-stat-value" style="color: var(--success);">${quizState.correct}</div>
                  <div class="result-stat-label">正确</div>
                </div>
                <div class="result-stat">
                  <div class="result-stat-value" style="color: var(--error);">${quizState.wrong}</div>
                  <div class="result-stat-label">错误</div>
                </div>
                <div class="result-stat">
                  <div class="result-stat-value" style="color: var(--warning);">${accuracy}%</div>
                  <div class="result-stat-label">正确率</div>
                </div>
              </div>

              ${wrongHtml}

              <div style="margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <button class="quiz-btn primary" onclick="${redoAllFn}">重新默写全部</button>
                ${quizState.wrongWords.length > 0 ? `<button class="quiz-btn secondary" onclick="startQuiz(quizState.wrongWords, '错误巩固', '${qt}')">巩固错误${typeLabel}</button>` : ""}
                <button class="quiz-btn secondary" onclick="renderQuizTypeSelect()">换个类型</button>
                <button class="quiz-btn secondary" onclick="switchMode('book')">返回单词书</button>
              </div>
            </div>
          </div>
        `;
      }

      function scrollUnitNav(direction) {
        const inner = document.getElementById("unitNavInner");
        const scrollAmount = 200;
        inner.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        setTimeout(updateUnitNavArrows, 300);
      }

      function updateUnitNavArrows() {
        const inner = document.getElementById("unitNavInner");
        const leftArrow = document.getElementById("unitNavLeft");
        const rightArrow = document.getElementById("unitNavRight");
        if (!inner || !leftArrow || !rightArrow) return;
        leftArrow.classList.toggle("hidden", inner.scrollLeft <= 0);
        rightArrow.classList.toggle("hidden", inner.scrollLeft + inner.clientWidth >= inner.scrollWidth - 1);
      }

      function buildUnitNav() {
        const nav = document.getElementById("unitNavInner");
        nav.innerHTML = '';
        const units = [...new Set(WORDS.map((w) => w.unit || '默认单元'))];

        units.forEach((unit) => {
          const btn = document.createElement("button");
          btn.className = "unit-btn";
          btn.textContent = unit;
          btn.addEventListener("click", () => {
            document.querySelectorAll(".unit-btn").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            const target = document.getElementById(`unit-${unit.replace(/\s+/g, '-')}`);
            if (target) {
              target.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
          nav.appendChild(btn);
        });
        updateUnitNavArrows();
        nav.addEventListener('scroll', updateUnitNavArrows);
      }

      function switchMode(mode) {
        document.querySelectorAll(".mode-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.mode === mode);
        });

        const unitNav = document.getElementById("unitNav");
        const searchBox = document.getElementById("searchBox");
        const wordCount = document.getElementById("wordCount");

        if (mode === "book") {
          unitNav.style.display = "flex";
          searchBox.style.display = "block";
          wordCount.style.display = "block";
          renderWords();
        } else if (mode === "quiz") {
          unitNav.style.display = "none";
          searchBox.style.display = "none";
          wordCount.style.display = "none";
          renderQuizTypeSelect();
        } else if (mode === "review") {
          unitNav.style.display = "none";
          searchBox.style.display = "none";
          wordCount.style.display = "none";
          renderReviewList();
        }
      }

      // Search
      let searchTimeout;
      document.getElementById("searchInput").addEventListener("input", (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          renderWords(e.target.value.trim());
        }, 200);
      });

      // Mode switch
      document.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.addEventListener("click", () => switchMode(btn.dataset.mode));
      });

      // Scroll spy for alphabet
      function updateActiveLetter() {
        const sections = document.querySelectorAll(".letter-section");
        let currentLetter = null;
        sections.forEach((section) => {
          const rect = section.getBoundingClientRect();
          if (rect.top <= 140) {
            currentLetter = section.id.replace("letter-", "");
          }
        });
        if (currentLetter) {
          document.querySelectorAll(".alpha-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.textContent === currentLetter);
          });
        }
      }

      document.querySelector(".main").parentElement.addEventListener("scroll", updateActiveLetter);
      window.addEventListener("scroll", updateActiveLetter);

      // ===== Ebbinghaus Review System =====
      const REVIEW_INTERVALS = [0, 1, 2, 4, 7, 15, 30];
      const TOTAL_REVIEWS = REVIEW_INTERVALS.length;

      let reviewState = {
        words: [],
        currentIndex: 0,
        answered: false,
        correct: 0,
        wrong: 0,
        wrongWords: [],
      };

      function getReviewData() {
        try {
          return JSON.parse(localStorage.getItem("wordReviewData")) || {};
        } catch {
          return {};
        }
      }

      function saveReviewData(data) {
        localStorage.setItem("wordReviewData", JSON.stringify(data));
      }

      function getWordReviewStatus(word) {
        const data = getReviewData();
        return data[word] || {
          learned: false,
          reviewCount: 0,
          lastReview: null,
          nextReview: null,
          reviewHistory: [],
        };
      }

      function markWordLearned(word) {
        const data = getReviewData();
        if (!data[word]) {
          data[word] = {
            learned: false,
            reviewCount: 0,
            lastReview: null,
            nextReview: null,
            reviewHistory: [],
          };
        }
        if (!data[word].learned) {
          data[word].learned = true;
          data[word].nextReview = Date.now() + REVIEW_INTERVALS[1] * 86400000;
          data[word].reviewHistory.push({ date: Date.now(), result: "learned" });
          saveReviewData(data);
        }
      }

      function completeReview(word, correct) {
        const data = getReviewData();
        if (!data[word]) return;
        const status = data[word];
        status.lastReview = Date.now();

        if (correct) {
          status.reviewCount = Math.min(status.reviewCount + 1, TOTAL_REVIEWS - 1);
          status.reviewHistory.push({ date: Date.now(), result: "correct" });
          if (status.reviewCount < TOTAL_REVIEWS - 1) {
            const nextInterval = REVIEW_INTERVALS[status.reviewCount + 1];
            status.nextReview = Date.now() + nextInterval * 86400000;
          } else {
            status.nextReview = null;
          }
        } else {
          status.reviewCount = Math.max(status.reviewCount - 1, 0);
          status.reviewHistory.push({ date: Date.now(), result: "wrong" });
          const nextInterval = REVIEW_INTERVALS[status.reviewCount];
          status.nextReview = Date.now() + nextInterval * 86400000;
        }

        data[word] = status;
        saveReviewData(data);
      }

      function getWordsDueForReview() {
        const now = Date.now();
        return WORDS.filter((w) => {
          const status = getWordReviewStatus(w.word);
          if (!status.learned) return false;
          if (status.nextReview === null) return false;
          return status.nextReview <= now;
        });
      }

      function getReviewStats() {
        const data = getReviewData();
        const now = Date.now();
        let learned = 0;
        let dueForReview = 0;
        let mastered = 0;

        WORDS.forEach((w) => {
          const status = data[w.word];
          if (!status || !status.learned) return;
          learned++;
          if (status.reviewCount >= TOTAL_REVIEWS - 1 && status.nextReview === null) {
            mastered++;
          } else if (status.nextReview && status.nextReview <= now) {
            dueForReview++;
          }
        });

        return { learned, dueForReview, mastered, total: WORDS.length };
      }

      function formatNextReviewTime(ts) {
        if (!ts) return "已完成";
        const now = Date.now();
        const diff = ts - now;
        if (diff <= 0) return "现在";
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor(diff / 3600000);
        if (days > 0) return `${days}天后`;
        if (hours > 0) return `${hours}小时后`;
        return "即将";
      }

      function renderReviewList() {
        const content = document.getElementById("content");
        const stats = getReviewStats();
        const dueWords = getWordsDueForReview();

        let statsHtml = `
          <div class="review-stats-grid">
            <div class="review-stat-card learned">
              <div class="stat-icon">📘</div>
              <div class="stat-value">${stats.learned}</div>
              <div class="stat-label">已学习</div>
            </div>
            <div class="review-stat-card due">
              <div class="stat-icon">⏰</div>
              <div class="stat-value">${stats.dueForReview}</div>
              <div class="stat-label">待复习</div>
            </div>
            <div class="review-stat-card mastered">
              <div class="stat-icon">✅</div>
              <div class="stat-value">${stats.mastered}</div>
              <div class="stat-label">已掌握</div>
            </div>
            <div class="review-stat-card total">
              <div class="stat-icon">📖</div>
              <div class="stat-value">${stats.total}</div>
              <div class="stat-label">总单词</div>
            </div>
          </div>
        `;

        if (stats.learned === 0) {
          content.innerHTML = `
            <div class="quiz-container">
              ${statsHtml}
              <div class="review-empty">
                <div class="review-empty-icon">📚</div>
                <h3>还没有学习过的单词</h3>
                <p>在单词书模式下点击单词开始学习，学习后将自动加入复习计划</p>
                <div class="review-actions">
                  <button class="quiz-btn primary" onclick="switchMode('book')">去学单词</button>
                  <button class="quiz-btn secondary" onclick="showHistoryManager()">历史记录管理</button>
                </div>
              </div>
            </div>
          `;
          return;
        }

        if (dueWords.length === 0) {
          content.innerHTML = `
            <div class="quiz-container">
              ${statsHtml}
              <div class="review-empty">
                <div class="review-empty-icon">🎉</div>
                <h3>暂时没有需要复习的单词</h3>
                <p>所有已学习的单词都按计划复习过了，继续保持！</p>
                <div class="review-actions">
                  <button class="quiz-btn secondary" onclick="switchMode('book')">返回单词书</button>
                  <button class="quiz-btn primary" onclick="switchMode('quiz')">去默写</button>
                  <button class="quiz-btn secondary" onclick="showHistoryManager()">历史记录管理</button>
                </div>
              </div>
            </div>
          `;
          return;
        }

        let wordListHtml = dueWords
          .map((w) => {
            const status = getWordReviewStatus(w.word);
            const dots = [];
            for (let i = 0; i < TOTAL_REVIEWS; i++) {
              if (i < status.reviewCount) {
                dots.push('<div class="review-dot filled"></div>');
              } else if (i === status.reviewCount) {
                dots.push('<div class="review-dot current"></div>');
              } else {
                dots.push('<div class="review-dot"></div>');
              }
            }
            return `
              <div class="review-word-item">
                <div class="review-word-info">
                  <div class="review-word-name">${w.word}</div>
                  <div class="review-word-def">${w.meanings[0].def}</div>
                </div>
                <div class="review-progress-dots" title="复习进度：${status.reviewCount}/${TOTAL_REVIEWS}">
                  ${dots.join("")}
                </div>
                <div class="review-next-time due-now">待复习</div>
                <button class="speak-btn" onclick="speak('${w.word}')" title="朗读">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                  </svg>
                </button>
              </div>
            `;
          })
          .join("");

        let allLearnedHtml = "";
        const learnedWords = WORDS.filter((w) => {
          const s = getWordReviewStatus(w.word);
          return s.learned;
        });
        const notDueWords = learnedWords.filter((w) => {
          const s = getWordReviewStatus(w.word);
          return s.nextReview === null || s.nextReview > Date.now();
        });

        if (notDueWords.length > 0) {
          allLearnedHtml = `
            <div class="review-section-title" style="margin-top: 24px;">
              已学习（未到复习时间）
              <span style="font-size:13px; color: var(--text-secondary); font-weight:400;">${notDueWords.length} 个</span>
            </div>
            <div class="review-word-list">
              ${notDueWords
                .map((w) => {
                  const status = getWordReviewStatus(w.word);
                  const dots = [];
                  for (let i = 0; i < TOTAL_REVIEWS; i++) {
                    if (i < status.reviewCount) {
                      dots.push('<div class="review-dot filled"></div>');
                    } else if (i === status.reviewCount) {
                      dots.push('<div class="review-dot current"></div>');
                    } else {
                      dots.push('<div class="review-dot"></div>');
                    }
                  }
                  return `
                    <div class="review-word-item">
                      <div class="review-word-info">
                        <div class="review-word-name">${w.word}</div>
                        <div class="review-word-def">${w.meanings[0].def}</div>
                      </div>
                      <div class="review-progress-dots" title="复习进度：${status.reviewCount}/${TOTAL_REVIEWS}">
                        ${dots.join("")}
                      </div>
                      <div class="review-next-time">${formatNextReviewTime(status.nextReview)}</div>
                      <button class="speak-btn" onclick="speak('${w.word}')" title="朗读">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                        </svg>
                      </button>
                    </div>
                  `;
                })
                .join("")}
            </div>
          `;
        }

        content.innerHTML = `
          <div class="quiz-container">
            ${statsHtml}
            <div class="review-section-title">
              需要复习的单词
              <span class="review-badge">${dueWords.length} 个</span>
            </div>
            <div class="review-actions" style="margin-bottom: 20px;">
              <button class="quiz-btn primary" onclick="startReview()">开始复习 (${dueWords.length})</button>
              <button class="quiz-btn secondary" onclick="showHistoryManager()">历史记录管理</button>
            </div>
            <div class="review-word-list">
              ${wordListHtml}
            </div>
            ${allLearnedHtml}
          </div>
        `;
      }

      function startReview() {
        const dueWords = getWordsDueForReview();
        if (dueWords.length === 0) return;
        reviewState = {
          words: shuffleArray(dueWords),
          currentIndex: 0,
          answered: false,
          correct: 0,
          wrong: 0,
          wrongWords: [],
        };
        renderReview();
      }

      function renderReview() {
        const content = document.getElementById("content");

        if (reviewState.currentIndex >= reviewState.words.length) {
          renderReviewComplete();
          return;
        }

        const currentWord = reviewState.words[reviewState.currentIndex];
        const progress =
          ((reviewState.currentIndex + 1) / reviewState.words.length) * 100;
        const status = getWordReviewStatus(currentWord.word);

        content.innerHTML = `
          <div class="quiz-container">
            <div class="quiz-header">
              <div class="quiz-title">艾宾浩斯复习</div>
              <div class="quiz-subtitle">第 ${status.reviewCount + 1} 次复习 · 间隔 ${REVIEW_INTERVALS[status.reviewCount + 1] || "—"} 天</div>
            </div>

            <div class="quiz-stats">
              <div class="stat-item">
                <div class="stat-value">${reviewState.currentIndex + 1}/${reviewState.words.length}</div>
                <div class="stat-label">进度</div>
              </div>
              <div class="stat-item">
                <div class="stat-value correct">${reviewState.correct}</div>
                <div class="stat-label">正确</div>
              </div>
              <div class="stat-item">
                <div class="stat-value wrong">${reviewState.wrong}</div>
                <div class="stat-label">错误</div>
              </div>
            </div>

            <div class="quiz-card">
              <div class="quiz-progress">
                <span class="progress-text">${reviewState.currentIndex + 1} / ${reviewState.words.length}</span>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${progress}%"></div>
                </div>
                <span class="progress-text">${Math.round(progress)}%</span>
              </div>

              <div class="quiz-question">
                <div class="quiz-pos">${currentWord.meanings[0].pos}</div>
                <div class="quiz-meaning">${currentWord.meanings[0].def}</div>
                <button class="quiz-speak-btn" onclick="speak('${currentWord.word.replace(/'/g, "\\'")}')" title="朗读单词">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                  </svg>
                  听读音
                </button>
                <div class="quiz-hint" id="quizHint" style="display: none;"></div>
              </div>

              <div class="quiz-input-area">
                <input
                  type="text"
                  class="quiz-input"
                  id="quizInput"
                  placeholder="输入英文单词..."
                  autocomplete="off"
                  spellcheck="false"
                />
              </div>

              <div class="quiz-actions">
                <button class="quiz-btn secondary" id="hintBtn" onclick="showReviewHint()">提示</button>
                <button class="quiz-btn primary" id="submitBtn" onclick="checkReviewAnswer()">提交</button>
                <button class="quiz-btn secondary" id="nextBtn" onclick="nextReviewWord()" style="display: none;">下一个</button>
              </div>

              <div class="quiz-feedback" id="quizFeedback"></div>
            </div>
          </div>
        `;

        const input = document.getElementById("quizInput");
        input.focus();
        input.addEventListener("keypress", (e) => {
          if (e.key === "Enter") {
            if (!reviewState.answered) {
              checkReviewAnswer();
            } else {
              nextReviewWord();
            }
          }
        });
      }

      function showReviewHint() {
        const currentWord = reviewState.words[reviewState.currentIndex];
        const hint = document.getElementById("quizHint");
        hint.style.display = "block";
        hint.textContent = `音节：${currentWord.syllable} | 首字母：${currentWord.word[0].toUpperCase()}`;
      }

      function checkReviewAnswer() {
        if (reviewState.answered) return;

        const input = document.getElementById("quizInput");
        const feedback = document.getElementById("quizFeedback");
        const currentWord = reviewState.words[reviewState.currentIndex];
        const userAnswer = input.value.trim().toLowerCase();

        if (!userAnswer) {
          input.style.borderColor = "var(--error)";
          setTimeout(() => {
            input.style.borderColor = "";
          }, 500);
          return;
        }

        reviewState.answered = true;
        const isCorrect = userAnswer === currentWord.word.toLowerCase();

        completeReview(currentWord.word, isCorrect);

        if (isCorrect) {
          reviewState.correct++;
          input.classList.add("correct");
          feedback.className = "quiz-feedback show correct";
          feedback.innerHTML = `
            <div>✓ 正确！</div>
            <div class="answer">${currentWord.word}</div>
          `;
          speak(currentWord.word);
        } else {
          reviewState.wrong++;
          reviewState.wrongWords.push(currentWord);
          input.classList.add("wrong");
          feedback.className = "quiz-feedback show wrong";
          feedback.innerHTML = `
            <div>✗ 错误</div>
            <div class="answer">正确答案：${currentWord.word}</div>
          `;
        }

        document.getElementById("submitBtn").style.display = "none";
        document.getElementById("hintBtn").style.display = "none";
        document.getElementById("nextBtn").style.display = "inline-block";
        document.getElementById("nextBtn").focus();

        document.querySelectorAll(".stat-value.correct")[0].textContent = reviewState.correct;
        document.querySelectorAll(".stat-value.wrong")[0].textContent = reviewState.wrong;
      }

      function nextReviewWord() {
        reviewState.currentIndex++;
        reviewState.answered = false;
        renderReview();
      }

      function renderReviewComplete() {
        const content = document.getElementById("content");
        const total = reviewState.words.length;
        const accuracy = total > 0 ? Math.round((reviewState.correct / total) * 100) : 0;

        let wrongWordsHtml = "";
        if (reviewState.wrongWords.length > 0) {
          wrongWordsHtml = `
            <div class="wrong-words-list">
              <h3 style="margin-bottom: 12px; font-size: 16px;">需要再次复习的单词</h3>
              ${reviewState.wrongWords
                .map(
                  (w) => `
                <div class="wrong-word-item">
                  <div>
                    <div class="wrong-word-text">${w.word}</div>
                    <div class="wrong-word-meaning">${w.meanings[0].def}</div>
                  </div>
                  <button class="speak-btn" onclick="speak('${w.word}')" title="朗读">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                      <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                      <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                    </svg>
                  </button>
                </div>
              `
                )
                .join("")}
            </div>
          `;
        }

        content.innerHTML = `
          <div class="quiz-container">
            <div class="review-complete-card">
              <div class="result-icon">${accuracy >= 80 ? "🎉" : accuracy >= 60 ? "👍" : "💪"}</div>
              <div class="result-title">复习完成！</div>
              <div style="color: var(--text-secondary); margin-bottom: 24px;">
                ${accuracy >= 80 ? "记忆效果很好，继续保持！" : accuracy >= 60 ? "不错，按时复习效果更好！" : "别担心，多复习几次就记住了！"}
              </div>

              <div class="result-stats">
                <div class="result-stat">
                  <div class="result-stat-value" style="color: var(--primary);">${total}</div>
                  <div class="result-stat-label">复习单词</div>
                </div>
                <div class="result-stat">
                  <div class="result-stat-value" style="color: var(--success);">${reviewState.correct}</div>
                  <div class="result-stat-label">正确</div>
                </div>
                <div class="result-stat">
                  <div class="result-stat-value" style="color: var(--error);">${reviewState.wrong}</div>
                  <div class="result-stat-label">错误</div>
                </div>
                <div class="result-stat">
                  <div class="result-stat-value" style="color: var(--warning);">${accuracy}%</div>
                  <div class="result-stat-label">正确率</div>
                </div>
              </div>

              <div style="background: var(--bg); border-radius: var(--radius-sm); padding: 14px 18px; margin-top: 16px; text-align: left;">
                <div style="font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">艾宾浩斯记忆曲线</div>
                <div style="font-size: 13px; color: var(--text); line-height: 1.7;">
                  复习间隔：立即 → 1天 → 2天 → 4天 → 7天 → 15天 → 30天<br>
                  答对的单词间隔延长，答错的单词间隔缩短，科学巩固记忆。
                </div>
              </div>

              ${wrongWordsHtml}

              <div style="margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <button class="quiz-btn primary" onclick="renderReviewList()">返回复习列表</button>
                <button class="quiz-btn secondary" onclick="switchMode('book')">返回单词书</button>
              </div>
            </div>
          </div>
        `;
      }

      // Auto-mark words as learned when expanding in book mode
      const originalCreateWordCard = createWordCard;
      createWordCard = function (item) {
        const card = originalCreateWordCard(item);
        card.addEventListener("click", () => {
          markWordLearned(item.word);
        });
        return card;
      };

      // ===== History Manager =====
      function showHistoryManager() {
        const reviewData = getReviewData();
        const learnedCount = Object.values(reviewData).filter(d => d.learned).length;
        const masteredCount = Object.values(reviewData).filter(d => d.reviewCount >= TOTAL_REVIEWS - 1).length;
        const customWordsCount = JSON.parse(localStorage.getItem('customWords') || '[]').length;

        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.id = 'historyModal';
        overlay.innerHTML = `
          <div class="modal" style="max-width: 520px;">
            <div class="modal-title">历史记录管理</div>
            <div class="modal-content history-manager">
              <div class="history-stats">
                <div class="history-stat">已学习：<strong>${learnedCount}</strong> 个</div>
                <div class="history-stat">已掌握：<strong>${masteredCount}</strong> 个</div>
                <div class="history-stat">导入单词：<strong>${customWordsCount}</strong> 个</div>
              </div>

              <div class="history-section">
                <div class="history-section-title">📊 复习进度</div>
                <div class="history-section-desc">清除所有单词的艾宾浩斯复习记录，包括学习状态、复习次数和下次复习时间。单词本身不会被删除。</div>
                <div class="history-section-actions">
                  <button class="history-btn danger" onclick="clearReviewProgress()">清除复习进度</button>
                </div>
              </div>

              <div class="history-section">
                <div class="history-section-title">📥 导入的单词</div>
                <div class="history-section-desc">删除所有通过PDF导入的自定义单词，保留内置的40个示例单词。</div>
                <div class="history-section-actions">
                  <button class="history-btn danger" onclick="clearCustomWords()">清除导入单词</button>
                </div>
              </div>

              <div class="history-section">
                <div class="history-section-title">🗑️ 全部数据</div>
                <div class="history-section-desc">清除所有数据，包括复习进度和导入的单词。此操作不可恢复。</div>
                <div class="history-section-actions">
                  <button class="history-btn danger" onclick="clearAllData()">清除全部数据</button>
                </div>
              </div>
            </div>
            <div class="modal-actions">
              <button class="modal-btn secondary" onclick="closeHistoryManager()">关闭</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
      }

      function closeHistoryManager() {
        const modal = document.getElementById('historyModal');
        if (modal) modal.remove();
      }

      function showConfirm(title, message, onConfirm) {
        const overlay = document.createElement('div');
        overlay.className = 'confirm-overlay';
        overlay.id = 'confirmOverlay';
        overlay.innerHTML = `
          <div class="confirm-dialog">
            <div class="confirm-title">${title}</div>
            <div class="confirm-message">${message}</div>
            <div class="confirm-actions">
              <button class="modal-btn secondary" onclick="closeConfirm()">取消</button>
              <button class="modal-btn primary" id="confirmBtn">确认</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
        document.getElementById('confirmBtn').addEventListener('click', () => {
          closeConfirm();
          onConfirm();
        });
      }

      function closeConfirm() {
        const overlay = document.getElementById('confirmOverlay');
        if (overlay) overlay.remove();
      }

      function clearReviewProgress() {
        showConfirm(
          '清除复习进度',
          '确定要清除所有单词的复习记录吗？<br><br>这将重置所有单词的学习状态、复习次数和下次复习时间，但不会删除单词本身。',
          () => {
            localStorage.removeItem('wordReviewData');
            closeHistoryManager();
            showHistoryManager();
            alert('复习进度已清除');
          }
        );
      }

      function clearCustomWords() {
        showConfirm(
          '清除导入单词',
          '确定要删除所有通过PDF导入的单词吗？<br><br>这将删除所有自定义单词，但保留内置的40个示例单词和复习记录。',
          () => {
            localStorage.removeItem('customWords');
            WORDS = WORDS.filter(w => !w.unit || w.unit === '默认单元');
            closeHistoryManager();
            buildUnitNav();
            renderWords();
            alert('导入单词已清除');
          }
        );
      }

      function clearAllData() {
        showConfirm(
          '清除全部数据',
          '确定要清除所有数据吗？<br><br><strong style="color: var(--error);">此操作不可恢复！</strong><br><br>将删除：\n• 所有复习进度\n• 所有导入的单词\n\n内置的40个示例单词将保留。',
          () => {
            localStorage.removeItem('wordReviewData');
            localStorage.removeItem('customWords');
            WORDS = WORDS.filter(w => !w.unit || w.unit === '默认单元');
            closeHistoryManager();
            buildUnitNav();
            renderWords();
            alert('全部数据已清除');
          }
        );
      }

      // ===== PDF Import System =====
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      let UNIT_DATA = {};
      let CURRENT_UNIT = null;

      function handlePdfUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        showParseModal(file);
        event.target.value = '';
      }

      function showParseModal(file) {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.id = 'parseModal';
        overlay.innerHTML = `
          <div class="modal">
            <div class="modal-title">解析PDF文件</div>
            <div class="modal-content">
              <p>文件：<strong>${file.name}</strong></p>
              <p style="font-size: 13px; color: var(--text-secondary); margin-top: 8px;">共 ${file.size > 1024 * 1024 ? (file.size / 1024 / 1024).toFixed(1) + ' MB' : (file.size / 1024).toFixed(0) + ' KB'}</p>
              
              <div class="ocr-options">
                <div class="ocr-option-group">
                  <label class="ocr-option-label">识别语言</label>
                  <div class="ocr-lang-select">
                    <button class="ocr-lang-btn active" data-lang="eng+chi_sim">中英混合</button>
                    <button class="ocr-lang-btn" data-lang="eng">仅英文</button>
                    <button class="ocr-lang-btn" data-lang="chi_sim">仅中文</button>
                  </div>
                </div>
                <div class="ocr-option-group">
                  <label class="ocr-option-label">页码范围（留空表示全部）</label>
                  <div class="ocr-page-range">
                    <input type="number" class="ocr-page-input" id="ocrPageStart" placeholder="起始页" min="1" />
                    <span>至</span>
                    <input type="number" class="ocr-page-input" id="ocrPageEnd" placeholder="结束页" min="1" />
                  </div>
                </div>
              </div>

              <div class="parse-progress">
                <div class="parse-progress-bar">
                  <div class="parse-progress-fill" id="parseProgressFill" style="width: 0%"></div>
                </div>
                <div class="parse-progress-text" id="parseProgressText">准备中...</div>
                <div class="ocr-progress-detail" id="ocrProgressDetail"></div>
              </div>
              <div class="parse-result" id="parseResult" style="display: none;"></div>
              <div class="ocr-preview" id="ocrPreview" style="display: none;"></div>
            </div>
            <div class="modal-actions" id="parseModalActions">
              <button class="modal-btn secondary" onclick="closeParseModal()">取消</button>
              <button class="modal-btn primary" onclick="startOcrParse()">开始识别</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);

        // Language selection
        overlay.querySelectorAll('.ocr-lang-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            overlay.querySelectorAll('.ocr-lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          });
        });

        window._currentPdfFile = file;
      }

      function closeParseModal() {
        const modal = document.getElementById('parseModal');
        if (modal) modal.remove();
      }

      async function parsePdf(file) {
        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          const totalPages = pdf.numPages;
          let fullText = '';

          for (let i = 1; i <= totalPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(' ');
            fullText += pageText + '\n';

            const progress = Math.round((i / totalPages) * 100);
            updateParseProgress(progress, `正在解析第 ${i}/${totalPages} 页...`);
          }

          updateParseProgress(100, '解析完成，正在提取单词...');
          const units = extractUnitsFromText(fullText);
          displayParseResult(units);
        } catch (error) {
          console.error('PDF解析错误:', error);
          updateParseProgress(0, '解析失败：' + error.message);
        }
      }

      async function startOcrParse() {
        const file = window._currentPdfFile;
        if (!file) return;

        const langBtn = document.querySelector('.ocr-lang-btn.active');
        const lang = langBtn ? langBtn.dataset.lang : 'eng+chi_sim';
        const pageStart = parseInt(document.getElementById('ocrPageStart').value) || 1;
        const pageEnd = parseInt(document.getElementById('ocrPageEnd').value) || 0;

        const actions = document.getElementById('parseModalActions');
        actions.innerHTML = '<button class="modal-btn secondary" onclick="closeParseModal()" disabled>取消</button>';

        updateParseProgress(5, '正在初始化OCR引擎...');
        document.getElementById('ocrProgressDetail').textContent = '首次使用需要下载语言数据，请耐心等待...';

        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          const totalPages = pdf.numPages;
          const endPage = pageEnd > 0 ? Math.min(pageEnd, totalPages) : totalPages;

          let fullText = '';
          
          // Create worker with explicit language data path
          const worker = await Tesseract.createWorker(lang, 1, {
            logger: m => {
              if (m.status === 'loading tesseract core') {
                updateParseProgress(10, '加载OCR核心...');
              } else if (m.status === 'initializing tesseract') {
                updateParseProgress(15, '初始化OCR...');
              } else if (m.status === 'loading language traineddata') {
                updateParseProgress(20, '下载语言数据...');
              }
            }
          });

          updateParseProgress(25, '开始识别...');

          for (let i = pageStart; i <= endPage; i++) {
            const progress = 25 + Math.round(((i - pageStart + 1) / (endPage - pageStart + 1)) * 75);
            updateParseProgress(progress, `正在识别第 ${i}/${endPage} 页...`);
            document.getElementById('ocrProgressDetail').textContent = `进度：${i - pageStart + 1} / ${endPage - pageStart + 1} 页`;

            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale: 2.0 });
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({ canvasContext: context, viewport: viewport }).promise;

            const { data: { text } } = await worker.recognize(canvas);
            fullText += `--- Page ${i} ---\n${text}\n\n`;

            const preview = document.getElementById('ocrPreview');
            preview.style.display = 'block';
            preview.textContent = text.substring(0, 500) + (text.length > 500 ? '...' : '');
          }

          await worker.terminate();
          updateParseProgress(100, 'OCR识别完成，正在提取单词...');
          document.getElementById('ocrProgressDetail').textContent = '';

          const units = extractUnitsFromText(fullText);
          displayParseResult(units);
        } catch (error) {
          console.error('OCR识别错误:', error);
          updateParseProgress(0, '识别失败：' + error.message);
          document.getElementById('ocrProgressDetail').textContent = '请检查网络连接后重试';
          actions.innerHTML = `
            <button class="modal-btn secondary" onclick="closeParseModal()">关闭</button>
            <button class="modal-btn primary" onclick="startOcrParse()">重试</button>
          `;
        }
      }

      function updateParseProgress(percent, text) {
        const fill = document.getElementById('parseProgressFill');
        const progressText = document.getElementById('parseProgressText');
        if (fill) fill.style.width = percent + '%';
        if (progressText) progressText.textContent = text;
      }

      function extractUnitsFromText(text) {
        const units = {};
        const lines = text.split('\n');
        let currentUnit = null;

        const unitPattern = /(?:Unit|单元|第)\s*(\d+|[A-Z]|一|二|三|四|五|六|七|八|九|十)/i;
        const wordPattern = /^([a-zA-Z]+)\s+[/（(]([^）)]+)[）)]\s*(.+)$/;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          const unitMatch = line.match(unitPattern);

          if (unitMatch) {
            currentUnit = 'Unit ' + unitMatch[1];
            if (!units[currentUnit]) {
              units[currentUnit] = [];
            }
            continue;
          }

          if (currentUnit && line) {
            const wordMatch = line.match(wordPattern);
            if (wordMatch) {
              const word = wordMatch[1].toLowerCase();
              const phonetic = wordMatch[2];
              const meaning = wordMatch[3];

              let existingWord = units[currentUnit].find(w => w.word === word);
              if (!existingWord) {
                existingWord = {
                  word: word,
                  phonetic: '/' + phonetic + '/',
                  syllable: word,
                  meanings: [{ pos: '', def: meaning }],
                  example: '',
                  exampleCn: '',
                  extend: [],
                  phrases: [],
                  sentences: [],
                  unit: currentUnit
                };
                units[currentUnit].push(existingWord);
              }
            }
          }
        }

        if (Object.keys(units).length === 0) {
          units['默认单元'] = [];
          const words = text.match(/\b([a-zA-Z]{3,})\b/g);
          if (words) {
            const uniqueWords = [...new Set(words)].slice(0, 50);
            uniqueWords.forEach(word => {
              units['默认单元'].push({
                word: word.toLowerCase(),
                phonetic: '',
                syllable: word.toLowerCase(),
                meanings: [{ pos: '', def: '待补充' }],
                example: '',
                exampleCn: '',
                extend: [],
                phrases: [],
                sentences: [],
                unit: '默认单元'
              });
            });
          }
        }

        return units;
      }

      function displayParseResult(units) {
        const result = document.getElementById('parseResult');
        const actions = document.getElementById('parseModalActions');

        let html = '<div style="margin-bottom: 12px; font-weight: 600;">解析结果：</div>';
        let totalWords = 0;

        Object.entries(units).forEach(([unit, words]) => {
          totalWords += words.length;
          html += `
            <div class="parse-result-item">
              <span>${unit}</span>
              <span style="color: var(--primary); font-weight: 600;">${words.length} 个单词</span>
            </div>
          `;
        });

        html += `<div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-weight: 600;">总计：${totalWords} 个单词</div>`;

        result.innerHTML = html;
        result.style.display = 'block';

        actions.innerHTML = `
          <button class="modal-btn secondary" onclick="closeParseModal()">取消</button>
          <button class="modal-btn primary" onclick="importUnits()">导入单词</button>
        `;

        UNIT_DATA = units;
      }

      function importUnits() {
        Object.entries(UNIT_DATA).forEach(([unit, words]) => {
          if (!WORDS.some(w => w.unit === unit)) {
            words.forEach(word => {
              WORDS.push(word);
            });
          }
        });

        closeParseModal();
        buildUnitNav();
        renderWords();
        saveWordsToStorage();
      }

      function scrollUnitNav(direction) {
        const inner = document.getElementById("unitNavInner");
        const scrollAmount = 200;
        inner.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        setTimeout(updateUnitNavArrows, 300);
      }

      function updateUnitNavArrows() {
        const inner = document.getElementById("unitNavInner");
        const leftArrow = document.getElementById("unitNavLeft");
        const rightArrow = document.getElementById("unitNavRight");
        if (!inner || !leftArrow || !rightArrow) return;
        leftArrow.classList.toggle("hidden", inner.scrollLeft <= 0);
        rightArrow.classList.toggle("hidden", inner.scrollLeft + inner.clientWidth >= inner.scrollWidth - 1);
      }

      function buildUnitNav() {
        const unitNav = document.getElementById('unitNav');
        const unitNavInner = document.getElementById('unitNavInner');
        const units = [...new Set(WORDS.map(w => w.unit || '默认单元'))];

        if (units.length <= 1) {
          unitNav.style.display = 'none';
          return;
        }

        unitNav.style.display = 'flex';
        unitNavInner.innerHTML = '';

        units.forEach(unit => {
          const btn = document.createElement('button');
          btn.className = 'unit-btn';
          btn.textContent = unit;
          btn.addEventListener('click', () => {
            document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            CURRENT_UNIT = unit;
            renderWordsByUnit(unit);
          });
          unitNavInner.appendChild(btn);
        });
      }

      function renderWordsByUnit(unit) {
        const content = document.getElementById('content');
        content.innerHTML = '';

        const unitWords = WORDS.filter(w => (w.unit || '默认单元') === unit);

        const section = document.createElement('div');
        section.className = 'unit-section';

        section.innerHTML = `
          <div class="unit-header">
            <div class="unit-icon">${unit.replace('List ', '').replace('Unit ', '')}</div>
            <div class="unit-title">${unit}</div>
            <div class="unit-count">${unitWords.length} 个</div>
          </div>
        `;

        unitWords.forEach(item => {
          section.appendChild(createWordCard(item));
        });

        content.appendChild(section);
        document.getElementById('wordCount').textContent = `共 ${unitWords.length} 个单词`;
      }

      function saveWordsToStorage() {
        try {
          localStorage.setItem('customWords', JSON.stringify(WORDS));
        } catch (e) {
          console.error('保存失败:', e);
        }
      }

      function loadWordsFromStorage() {
        try {
          const saved = localStorage.getItem('customWords');
          if (saved) {
            const customWords = JSON.parse(saved);
            WORDS.push(...customWords);
          }
        } catch (e) {
          console.error('加载失败:', e);
        }
      }

      // Update createWordCard to show phrases and sentences
      const originalCreateWordCard2 = createWordCard;
      createWordCard = function(item) {
        const card = document.createElement('div');
        card.className = 'word-card';
        card.setAttribute('data-word', item.word.toLowerCase());
        card.setAttribute('data-def', item.meanings.map(m => m.def).join(' '));

        const meaningsHtml = item.meanings
          .map(m => `<span class="pos-tag">${m.pos}</span> ${m.def}`)
          .join('&nbsp;&nbsp;');

        const extendHtml = item.extend && item.extend.length > 0
          ? `<div class="detail-section">
              <div class="detail-label">拓展词汇</div>
              <div class="extend-words">
                ${item.extend.map(e => `<span class="extend-tag">${e}</span>`).join('')}
              </div>
            </div>`
          : '';

        const phrasesHtml = item.phrases && item.phrases.length > 0
          ? `<div class="phrase-section">
              <div class="detail-label">常用短语</div>
              <div class="unit-phrase-list">
                ${item.phrases.map(p => `<span class="phrase-item">${p}</span>`).join('')}
              </div>
            </div>`
          : '';

        const sentencesHtml = item.sentences && item.sentences.length > 0
          ? `<div class="sentence-section">
              <div class="detail-label">例句</div>
              <div class="unit-sentence-list">
                ${item.sentences.map(s => `
                  <div class="unit-sentence-item">
                    <div class="unit-sentence-en">${s.en || ''}</div>
                    <div class="unit-sentence-cn">${s.cn || ''}</div>
                  </div>
                `).join('')}
              </div>
            </div>`
          : (item.example ? `
            <div class="detail-section">
              <div class="detail-label">例句</div>
              <div class="detail-content">
                <div class="example-sentence">${item.example}</div>
                <div style="margin-top:4px; color: var(--text-secondary); font-size:13px;">${item.exampleCn}</div>
              </div>
            </div>
          ` : '');

        card.innerHTML = `
          <div class="word-top">
            <div class="word-main">
              <div class="word-text">
                ${item.word}
                <button class="speak-btn" onclick="event.stopPropagation(); speak('${item.word}')" title="朗读">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                  </svg>
                </button>
              </div>
              <div class="word-phonetic">${item.phonetic ? '/' + item.phonetic + '/' : ''}</div>
              <div class="word-syllable">${item.syllables && item.syllables !== item.word ? item.syllables : ''}</div>
              <div class="word-brief">${meaningsHtml}</div>
            </div>
          </div>
          <div class="word-detail">
            ${sentencesHtml}
            ${extendHtml}
            ${phrasesHtml}
          </div>
          <div class="expand-hint">点击展开详情 ↓</div>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.closest('.speak-btn')) return;
          card.classList.toggle('expanded');
        });

        return card;
      };

      // Load saved words on init
      loadWordsFromStorage();

      // Init
      buildUnitNav();
      renderWords();

      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    </script>
  </body>
</html>
